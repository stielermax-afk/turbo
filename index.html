<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Turbo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turbo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0c0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #0a0c0f;
    --flaeche: #151a20;
    --linie: #29303a;
    --text: #e9edf2;
    --leise: #8b95a3;
    --akzent: #38c6ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  #app {
    position: relative;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    gap: 8px;
  }
  header { text-align: center; }
  .marke { font-size: 13px; font-weight: 800; letter-spacing: 0.42em; margin-right: -0.42em; color: var(--leise); padding: 6px 14px; }
  #status {
    margin-top: 4px; min-height: 1.3em;
    font-size: 19px; font-weight: 700; letter-spacing: 0.02em; color: var(--akzent);
  }
  #lader { width: min(90vw, 54vh); height: auto; flex: 0 1 auto; display: block; }
  .anzeige { text-align: center; }
  #druck {
    font-size: clamp(54px, 17vw, 84px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  #druck small { font-size: 0.3em; font-weight: 700; letter-spacing: 0.08em; color: var(--leise); margin-left: 0.25em; }
  .neben { margin-top: 8px; font-size: 14px; color: var(--leise); font-variant-numeric: tabular-nums; }
  .neben b { color: var(--text); font-weight: 700; }
  footer { width: 100%; max-width: 420px; display: grid; gap: 12px; justify-items: center; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    border: 1px solid var(--linie); background: var(--flaeche);
    min-height: 48px; padding: 0 22px; border-radius: 14px; font-weight: 700; font-size: 15px;
  }
  button:active { background: #1d242c; }
  #sim { display: none; width: 100%; gap: 6px; font-size: 13px; color: var(--leise); text-align: center; }
  #sim input { width: 100%; accent-color: var(--akzent); height: 36px; }
  #blitz {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 42%, rgba(255, 190, 120, 0.9), rgba(255, 110, 40, 0.35) 45%, transparent 75%);
  }
  #start {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 32px; text-align: center;
    background: radial-gradient(circle at 50% 35%, #1a222b, var(--bg) 70%);
  }
  #start h1 { margin: 0; font-size: 44px; font-weight: 900; letter-spacing: 0.3em; margin-right: -0.3em; }
  #start p { margin: 0; max-width: 30ch; font-size: 17px; line-height: 1.45; color: var(--leise); }
  #start p b { color: var(--text); }
  #los {
    min-height: 68px; padding: 0 54px; border-radius: 34px; border: 0;
    background: #ff6a1f; color: #160a02; font-size: 22px; font-weight: 900; letter-spacing: 0.06em;
    box-shadow: 0 0 44px rgba(255, 106, 31, 0.35);
  }
  #los:active { background: #ff8242; }
  #los:disabled { opacity: 0.5; }
  #hinweis { color: #ffb38a !important; min-height: 1.4em; }

  /* Klang-Labor */
  #labor {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
    max-height: 66vh; max-height: 66dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-y; overscroll-behavior: contain;
    background: #10141a; border-top: 1px solid var(--linie); border-radius: 18px 18px 0 0;
    padding: 14px 16px max(16px, env(safe-area-inset-bottom));
    box-shadow: 0 -18px 40px rgba(0, 0, 0, 0.55);
  }
  #labor.offen { display: block; }
  #labor h2 { margin: 0 0 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.3em; color: var(--leise); text-align: center; }
  #labor .reihe { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-bottom: 10px; }
  #labor button { min-height: 44px; padding: 0 8px; font-size: 14px; border-radius: 12px; }
  #labor button.haupt { background: #ff6a1f; color: #160a02; border-color: transparent; }
  #labor label { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 0 10px; font-size: 14px; margin-top: 8px; }
  #labor label b { font-variant-numeric: tabular-nums; }
  #labor input[type=range] { grid-column: 1 / -1; width: 100%; height: 34px; accent-color: #ff6a1f; }
  #werte {
    width: 100%; margin: 12px 0 10px; padding: 8px; min-height: 64px; resize: none;
    background: #0a0c0f; color: var(--leise); border: 1px solid var(--linie); border-radius: 10px;
    font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
    -webkit-user-select: text; user-select: text;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="marke" id="marke">TURBO</div>
    <div id="status">Bereit</div>
  </header>

  <svg id="lader" viewBox="-108 -108 216 216" role="img" aria-label="Turbolader">
    <defs>
      <radialGradient id="gGehaeuse" cx="35%" cy="30%" r="80%">
        <stop offset="0" stop-color="#3a424d"/><stop offset="1" stop-color="#12151a"/>
      </radialGradient>
      <linearGradient id="gSchaufel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#eef2f6"/><stop offset="0.55" stop-color="#8b96a4"/><stop offset="1" stop-color="#3d4651"/>
      </linearGradient>
      <radialGradient id="gNabe" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#586270"/>
      </radialGradient>
      <radialGradient id="gWisch" cx="50%" cy="50%" r="50%">
        <stop offset="0.2" stop-color="#aeb8c4" stop-opacity="0.15"/>
        <stop offset="0.65" stop-color="#cfd7e0" stop-opacity="0.75"/>
        <stop offset="1" stop-color="#7f8a98" stop-opacity="0.9"/>
      </radialGradient>
    </defs>
    <g id="skala"></g>
    <circle id="bogenSpur" r="96" fill="none" stroke="#1b2027" stroke-width="6" stroke-linecap="round" transform="rotate(135)"/>
    <circle id="bogen" r="96" fill="none" stroke="var(--akzent)" stroke-width="6" stroke-linecap="round" transform="rotate(135)"/>
    <circle r="82" fill="url(#gGehaeuse)" stroke="#444c58" stroke-width="1.5"/>
    <circle r="63" fill="#050607" stroke="#0c0e11" stroke-width="5"/>
    <circle id="glut" r="61" fill="var(--akzent)" opacity="0"/>
    <g id="rad">
      <g id="schaufeln"></g>
      <circle id="wisch" r="58" fill="url(#gWisch)" opacity="0"/>
      <circle r="14" fill="url(#gNabe)" stroke="#2c333c" stroke-width="1"/>
      <path d="M0 -7 L6.06 -3.5 L6.06 3.5 L0 7 L-6.06 3.5 L-6.06 -3.5 Z" fill="#aab3bf" stroke="#3b434e" stroke-width="1"/>
      <circle cx="0" cy="-10.2" r="1.3" fill="#20262d"/>
    </g>
  </svg>

  <div class="anzeige">
    <div id="druck">0,00<small>BAR</small></div>
    <div class="neben">Kippwinkel <b id="winkel">0°</b> · Bestwert <b id="best">0,00 bar</b></div>
  </div>

  <footer>
    <label id="sim"><span id="simText">Kippwinkel (Test)</span>
      <input id="simRegler" type="range" min="0" max="180" step="1" value="0">
    </label>
    <button id="ausrichten" type="button">Neu ausrichten</button>
  </footer>
</div>

<div id="blitz"></div>

<div id="labor">
  <h2>KLANG-LABOR</h2>
  <div class="reihe">
    <button type="button" class="haupt" id="testBlowoff">Blow-off testen</button>
    <button type="button" class="haupt" id="testHoch">Hochdrehen testen</button>
  </div>
  <div class="reihe" id="vorgaben"></div>
  <div id="regler"></div>
  <textarea id="werte" readonly></textarea>
  <div class="reihe">
    <button type="button" id="kopieren">Werte kopieren</button>
    <button type="button" id="zurueck">Zurücksetzen</button>
    <button type="button" id="laborZu">Schließen</button>
  </div>
</div>

<div id="start">
  <h1>TURBO</h1>
  <p>Handy <b>wie ein Glas</b> halten und Start tippen. Zum Trinken kippen lädt den Turbo – beim Absetzen bläst er ab.</p>
  <button id="los" type="button">START</button>
  <p id="hinweis"></p>
</div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Feste Stellschrauben
  // ---------------------------------------------------------------------------
  const K = {
    VOLL_ABSTAND: 40,       // ° über dem Einsatzwinkel lädt der Turbo mit vollem Tempo
    AUS_ABSTAND: 8,         // ° unter dem Einsatzwinkel ist immer abgesetzt
    SCHARF_ABSTAND: 15,     // ° unter dem Einsatzwinkel wird nach einem Blow-off wieder scharf geschaltet
    AN_VERZOEGERUNG_MS: 80,
    HOCHLAUF_S: 6,          // Sekunden bis Volllast bei starkem Kippen
    MIN_DRUCK: 0.05,        // darunter gibt es beim Absetzen keinen Ton
    MAX_BAR: 2.0,           // Anzeige bei Volllast
    GLAETTUNG_S: 0.07,      // Tiefpass für den Sensor
    KALIBRIER_MS: 400,

    PFEIF_HZ_MIN: 320,      // Tonhöhe des Pfeifens im Stand (Volllast: Regler „Pfeif-Tonhöhe“)
    PFEIF_LAUT: 0.20,
    RAUSCH_LAUT: 0.34,
    KOERPER_LAUT: 0.9,
    BLOWOFF_MIN_S: 0.3,     // Länge des Abblasens bei wenig Ladedruck (voll: Regler „Länge“)
    BLOWOFF_LAUT: 1.0,

    RAD_MAX: 1150,          // °/s Drehung der Anzeige bei Volllast
  };

  // ---------------------------------------------------------------------------
  // Regelbare Werte (Klang-Labor). STANDARD = Auslieferungszustand.
  // ---------------------------------------------------------------------------
  const STANDARD = {
    einsatz: 90,   // ° ab hier baut sich Ladedruck auf
    abfall: 15,    // ° Rückweg vom größten Kippwinkel, der das Blow-off auslöst
    rauh: 0.6,     // Verzerrung 0…1
    koerper: 0.6,  // tiefer Anteil 0…1
    flatter: 1,    // 1 = „tu-tu-tu“, 0 = durchgehendes Zischen
    tempo: 18,     // Stöße pro Sekunde am Anfang (am Ende halb so viele)
    ton: 1,        // Tonhöhe der Stöße (Faktor)
    laenge: 1.5,   // Sekunden bei vollem Ladedruck
    pfeif: 4600,   // Hz Pfeifen bei Volllast
    schweb: 0.2,   // raue Schwebung beim Hochdrehen
    hall: 0.12,    // Raumanteil
  };
  const REGLER = [
    ['einsatz', 'Einsatzwinkel', 20, 150, 1, '°'],
    ['abfall', 'Absetz-Abfall', 5, 40, 1, '°'],
    ['rauh', 'Rauheit', 0, 1, 0.05, ''],
    ['koerper', 'Körper (tief)', 0, 1, 0.05, ''],
    ['flatter', 'Flatter-Anteil', 0, 1, 0.05, ''],
    ['tempo', 'Flatter-Tempo', 8, 30, 1, '/s'],
    ['ton', 'Flatter-Tonhöhe', 0.5, 2, 0.05, '×'],
    ['laenge', 'Länge', 0.5, 2.5, 0.1, ' s'],
    ['pfeif', 'Pfeif-Tonhöhe', 2000, 7000, 100, ' Hz'],
    ['schweb', 'Schwebung', 0, 0.5, 0.02, ''],
    ['hall', 'Hall', 0, 0.4, 0.02, ''],
  ];
  const VORGABEN = {
    'Flattern': {},
    'Zischen': { flatter: 0.15, laenge: 0.9, tempo: 22, ton: 1.3, koerper: 0.35 },
    'Grob & tief': { rauh: 0.95, koerper: 0.9, ton: 0.75, tempo: 15, laenge: 1.8, schweb: 0.3 },
  };
  const P = Object.assign({}, STANDARD);
  try {
    const gespeichert = JSON.parse(localStorage.getItem('turbo.klang.v1') || '{}');
    for (const k of Object.keys(STANDARD)) if (typeof gespeichert[k] === 'number' && isFinite(gespeichert[k])) P[k] = gespeichert[k];
  } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const lerp = (a, b, t) => a + (b - a) * t;
  const klemme = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const bar = (druck) => (druck * K.MAX_BAR).toFixed(2).replace('.', ',');
  const PARAMETER = new URLSearchParams(location.search);
  const SIM_ERZWUNGEN = PARAMETER.has('sim');
  const NS = 'http://www.w3.org/2000/svg';

  const z = {
    laeuft: false, sim: false,
    zustand: 'RUHE',        // RUHE | TRINKEN | ABSETZEN
    scharf: true,           // nach einem Blow-off erst wieder laden, wenn das Handy unten war
    winkel: 0, spitzenWinkel: 0, anSeit: 0, absetzenBis: 0, testBis: 0,
    druck: 0,               // Ladedruck 0…1
    rad: 0, radTempo: 0, blitz: 0,
    best: 0, letztePulse: 0, letzteStaerke: 0,
  };
  try { z.best = Number(JSON.parse(localStorage.getItem('turbo.v1') || '{}').best) || 0; } catch (e) {}

  // ---------------------------------------------------------------------------
  // Zeichnung aufbauen
  // ---------------------------------------------------------------------------
  const UMFANG = 2 * Math.PI * 96;
  const BOGEN = UMFANG * 0.75;
  $('bogenSpur').setAttribute('stroke-dasharray', `${BOGEN} ${UMFANG}`);
  (function baueRad() {
    const g = $('schaufeln');
    for (let i = 0; i < 10; i++) {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', 'M-4 -12 Q5 -31 23 -52 L33 -46 Q14 -29 6 -10 Z');
      p.setAttribute('fill', 'url(#gSchaufel)');
      p.setAttribute('stroke', '#20262d');
      p.setAttribute('stroke-width', '0.6');
      p.setAttribute('transform', `rotate(${i * 36})`);
      g.appendChild(p);
    }
    const skala = $('skala');
    for (let i = 0; i <= 8; i++) {
      const w = (135 + (270 * i) / 8) * Math.PI / 180;
      const lang = i % 2 === 0;
      const l = document.createElementNS(NS, 'line');
      const r1 = 101.5, r2 = lang ? 107 : 104.5;
      l.setAttribute('x1', Math.cos(w) * r1); l.setAttribute('y1', Math.sin(w) * r1);
      l.setAttribute('x2', Math.cos(w) * r2); l.setAttribute('y2', Math.sin(w) * r2);
      l.setAttribute('stroke', lang ? '#6b7583' : '#3a424d');
      l.setAttribute('stroke-width', lang ? 1.6 : 1);
      l.setAttribute('stroke-linecap', 'round');
      skala.appendChild(l);
    }
  })();

  // ---------------------------------------------------------------------------
  // Bewegungssensor: Kippwinkel gegenüber der Ruhelage beim Start
  // ---------------------------------------------------------------------------
  let g = null, ref = null, letzteProbe = 0, kalibStart = 0, proben = 0;

  function aufBewegung(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null || a.z == null) return;
    const jetzt = performance.now();
    proben++;
    if (!g) {
      g = { x: a.x, y: a.y, z: a.z };
    } else {
      const dt = Math.min(0.2, (jetzt - letzteProbe) / 1000);
      const k = 1 - Math.exp(-dt / K.GLAETTUNG_S);
      g.x += (a.x - g.x) * k; g.y += (a.y - g.y) * k; g.z += (a.z - g.z) * k;
    }
    letzteProbe = jetzt;
    if (!ref) {
      if (!kalibStart) kalibStart = jetzt;
      if (jetzt - kalibStart >= K.KALIBRIER_MS) {
        const n = Math.hypot(g.x, g.y, g.z);
        if (n > 1) ref = { x: g.x / n, y: g.y / n, z: g.z / n };
      }
      return;
    }
    if (z.sim) return;
    const n = Math.hypot(g.x, g.y, g.z) || 1;
    const punkt = klemme((ref.x * g.x + ref.y * g.y + ref.z * g.z) / n, -1, 1);
    z.winkel = Math.acos(punkt) * 180 / Math.PI;
  }

  function neuAusrichten() {
    ref = null; kalibStart = 0;
    z.zustand = 'RUHE'; z.druck = 0; z.anSeit = 0; z.winkel = 0; z.scharf = true; z.testBis = 0;
    if (klang) klang.frei();
    if (z.sim) $('simRegler').value = 0;
  }

  function simAn(text) {
    z.sim = true; z.winkel = 0;
    $('sim').style.display = 'grid';
    if (text) $('simText').textContent = text;
  }

  // ---------------------------------------------------------------------------
  // Ton: alles synthetisch (Web Audio), keine Audiodateien.
  // baueKlang() funktioniert auch mit einem OfflineAudioContext (zum Prüfen).
  // ---------------------------------------------------------------------------
  const pfeifHzBei = (d) => K.PFEIF_HZ_MIN * Math.pow(P.pfeif / K.PFEIF_HZ_MIN, Math.pow(d, 0.75));

  function baueKlang(ctx) {
    const rate = ctx.sampleRate;
    const gain = (wert) => { const n = ctx.createGain(); n.gain.value = wert; return n; };
    const filter = (typ, hz, q) => { const n = ctx.createBiquadFilter(); n.type = typ; n.frequency.value = hz; if (q != null) n.Q.value = q; return n; };
    const kette = (...knoten) => { for (let i = 0; i < knoten.length - 1; i++) knoten[i].connect(knoten[i + 1]); return knoten[knoten.length - 1]; };

    // Verzerrer: weiche Sättigung, 4-fach überabgetastet (sonst klingt es digital)
    const kurve = new Float32Array(2048);
    for (let i = 0; i < kurve.length; i++) kurve[i] = Math.tanh(4 * ((i / (kurve.length - 1)) * 2 - 1));
    const verzerrer = () => { const n = ctx.createWaveShaper(); n.curve = kurve; n.oversample = '4x'; return n; };

    // Rauschquellen: weiß (hell) und rosa (dunkler, mit Körper)
    const laenge = Math.floor(rate * 2);
    const weissPuffer = ctx.createBuffer(1, laenge, rate), rosaPuffer = ctx.createBuffer(1, laenge, rate);
    const wd = weissPuffer.getChannelData(0), rd = rosaPuffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < laenge; i++) {
      const w = Math.random() * 2 - 1;
      wd[i] = w;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
      b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
      rd[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.16;
      b6 = w * 0.115926;
    }
    const quelle = (puffer) => { const n = ctx.createBufferSource(); n.buffer = puffer; n.loop = true; n.start(); return n; };
    const weiss = quelle(weissPuffer), rosa = quelle(rosaPuffer);

    // Ausgang: Summe trocken + kurzer Hall, dahinter ein Begrenzer
    const summe = gain(1);
    const begrenzer = ctx.createDynamicsCompressor();
    begrenzer.threshold.value = -8; begrenzer.knee.value = 6; begrenzer.ratio.value = 12;
    begrenzer.attack.value = 0.003; begrenzer.release.value = 0.12;
    const haupt = gain(0.9);
    const hallPuffer = ctx.createBuffer(1, Math.floor(rate * 0.28), rate);
    const hd = hallPuffer.getChannelData(0);
    for (let i = 0; i < hd.length; i++) hd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / hd.length, 3);
    const hall = ctx.createConvolver(); hall.buffer = hallPuffer;
    const nass = gain(0);
    kette(summe, begrenzer, haupt, ctx.destination);
    kette(summe, hall, nass, begrenzer);

    // --- Hochdrehen -----------------------------------------------------------
    const osz1 = ctx.createOscillator(); osz1.type = 'sawtooth';
    const osz2 = ctx.createOscillator(); osz2.type = 'sawtooth';
    const sinus = ctx.createOscillator(); sinus.type = 'sine';
    const pfeifFilter = filter('bandpass', K.PFEIF_HZ_MIN, 5);
    const pfeifGain = gain(0);
    osz1.connect(pfeifFilter); osz2.connect(pfeifFilter); pfeifFilter.connect(pfeifGain);
    kette(sinus, gain(0.6), pfeifGain);
    const rauschFilter = filter('bandpass', 700, 0.8);
    const rauschGain = gain(0);
    kette(weiss, rauschFilter, rauschGain);
    const koerperGain = gain(0);
    kette(rosa, filter('bandpass', 430, 0.7), koerperGain);

    const schweb = gain(1);      // raue Schwebung (Lautstärke flattert schnell)
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 35;
    const lfoTiefe = gain(0);
    kette(lfo, lfoTiefe); lfoTiefe.connect(schweb.gain);
    const hacker = gain(1);      // zerhackt das auslaufende Pfeifen beim Abblasen
    const vorS = gain(1), nachS = gain(0.4);
    pfeifGain.connect(schweb); rauschGain.connect(schweb); koerperGain.connect(schweb);
    kette(schweb, hacker, vorS, verzerrer(), nachS, summe);
    const stimmen = [osz1, osz2, sinus];
    stimmen.forEach((o) => { o.frequency.value = K.PFEIF_HZ_MIN; o.start(); });
    lfo.start();

    // --- Abblasen -------------------------------------------------------------
    const blasSumme = gain(1);
    const vorB = gain(1), nachB = gain(0.8);
    const blasHuelle = gain(1);  // Gesamtlautstärke des Abblasens, klingt über die Dauer ab
    kette(blasSumme, vorB, verzerrer(), nachB, blasHuelle, summe);
    // „Psch“: breiter Luftstoß, Filter fällt von hell nach dunkel
    const pschFilter = filter('bandpass', 5200, 0.7);
    const pschGain = gain(0);
    kette(weiss, filter('highpass', 900), pschFilter, pschGain, blasSumme);
    // „tu“: Luftstoß mit fallender Tonhöhe + heller Anschlag
    const stossFilter = filter('bandpass', 2200, 3);
    const stossGain = gain(0);
    kette(rosa, stossFilter, gain(5), stossGain, blasSumme);
    kette(weiss, filter('bandpass', 3200, 1.2), gain(0.3), stossGain);
    // hohler Körper jedes Stoßes
    const hohlOsz = ctx.createOscillator(); hohlOsz.type = 'triangle'; hohlOsz.frequency.value = 400; hohlOsz.start();
    const hohlGain = gain(0);
    kette(hohlOsz, hohlGain, blasSumme);
    // Grundzischen zwischen den Stößen
    const bettGain = gain(0);
    kette(rosa, filter('bandpass', 1500, 0.5), gain(3), bettGain, blasSumme);

    let jitter = 0;

    function anwenden() { // regelbare Werte in die festen Knoten übernehmen
      const t = ctx.currentTime;
      vorS.gain.setTargetAtTime(lerp(0.25, 2.5, P.rauh), t, 0.02);
      nachS.gain.setTargetAtTime(0.36 + 0.4 * Math.max(0, 1 - P.rauh / 0.6), t, 0.02);
      vorB.gain.setTargetAtTime(lerp(0.3, 1.5, P.rauh), t, 0.02);
      nachB.gain.setTargetAtTime(lerp(0.95, 0.78, P.rauh), t, 0.02);
      nass.gain.setTargetAtTime(P.hall * 3, t, 0.02);
    }

    function nachfuehren(d) { // Hochdrehen an den Ladedruck d (0…1) anpassen
      const t = ctx.currentTime;
      jitter = klemme(jitter * 0.94 + (Math.random() - 0.5) * 0.004, -0.012, 0.012);
      const f = pfeifHzBei(d) * (1 + jitter);
      osz1.frequency.setTargetAtTime(f, t, 0.05);
      osz2.frequency.setTargetAtTime(f * 1.006, t, 0.05);
      sinus.frequency.setTargetAtTime(f, t, 0.05);
      pfeifFilter.frequency.setTargetAtTime(f, t, 0.05);
      pfeifGain.gain.setTargetAtTime(Math.pow(d, 1.2) * K.PFEIF_LAUT, t, 0.05);
      rauschFilter.frequency.setTargetAtTime(700 + d * 4300, t, 0.05);
      rauschGain.gain.setTargetAtTime(d * K.RAUSCH_LAUT, t, 0.05);
      koerperGain.gain.setTargetAtTime(d * K.KOERPER_LAUT * P.koerper, t, 0.05);
      lfo.frequency.setTargetAtTime(35 + 35 * d, t, 0.05);
      lfoTiefe.gain.setTargetAtTime(P.schweb * d, t, 0.05);
    }

    // Plant das Abblasen ab Zeitpunkt t0 ein; gibt Dauer und die einzelnen Stöße zurück
    function blowoff(staerke, t0) {
      const dauer = lerp(K.BLOWOFF_MIN_S, P.laenge, staerke);
      const laut = K.BLOWOFF_LAUT * (0.35 + 0.65 * staerke);
      const pschKurz = 0.08 + 0.08 * staerke;
      const pschDauer = lerp(dauer * 0.85, pschKurz, P.flatter);
      const pulse = [];
      if (staerke >= 0.12 && P.flatter > 0.02) {
        let tt = pschKurz * 0.7;
        while (tt < dauer - 0.05) {
          const p = tt / dauer;
          const periode = (1 / lerp(P.tempo, P.tempo * 0.5, p)) * (1 + (Math.random() - 0.5) * 0.2);
          const a = laut * (0.2 + 0.8 * Math.pow(1 - p, 1.2)) * (1 + (Math.random() - 0.5) * 0.3);
          pulse.push({ t: tt, periode, p, a });
          tt += periode;
        }
      }

      // Pfeifen: läuft in der Tonhöhe aus statt abzubrechen
      const f0 = pfeifHzBei(staerke), f1 = Math.max(180, f0 * 0.28);
      [[osz1, 1], [osz2, 1.006], [sinus, 1], [pfeifFilter, 1]].forEach(([n, faktor]) => {
        n.frequency.cancelScheduledValues(t0);
        n.frequency.setValueAtTime(f0 * faktor, t0);
        n.frequency.exponentialRampToValueAtTime(f1 * faktor, t0 + dauer);
      });
      const g0 = Math.pow(staerke, 1.2) * K.PFEIF_LAUT;
      pfeifGain.gain.cancelScheduledValues(t0);
      pfeifGain.gain.setValueAtTime(g0, t0);
      pfeifGain.gain.linearRampToValueAtTime(g0 * 0.6, t0 + 0.03);
      pfeifGain.gain.linearRampToValueAtTime(0.0001, t0 + dauer);
      [rauschGain, koerperGain, lfoTiefe].forEach((n) => { n.gain.cancelScheduledValues(t0); n.gain.setTargetAtTime(0, t0, 0.03); });

      // „Psch“
      pschFilter.frequency.cancelScheduledValues(t0);
      pschFilter.frequency.setValueAtTime(5200, t0);
      pschFilter.frequency.exponentialRampToValueAtTime(1400, t0 + pschDauer);
      pschGain.gain.cancelScheduledValues(t0);
      pschGain.gain.setValueAtTime(0.0001, t0);
      pschGain.gain.linearRampToValueAtTime(laut * 0.9, t0 + 0.008);
      pschGain.gain.exponentialRampToValueAtTime(0.0001, t0 + pschDauer + 0.08);

      // Grundzischen
      bettGain.gain.cancelScheduledValues(t0);
      bettGain.gain.setValueAtTime(0.0001, t0);
      bettGain.gain.linearRampToValueAtTime(laut * (0.16 + 0.45 * (1 - P.flatter)), t0 + 0.02);
      bettGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dauer);

      // Gesamthülle: nach der Verzerrung, damit die Stöße hörbar leiser werden
      blasHuelle.gain.cancelScheduledValues(t0);
      blasHuelle.gain.setValueAtTime(0.45 + 0.55 * staerke, t0);
      blasHuelle.gain.exponentialRampToValueAtTime((0.45 + 0.55 * staerke) * 0.22, t0 + dauer);

      // Stöße: jeder klingt über fast die ganze Periode aus (kein kurzes Ticken)
      [stossGain.gain, hohlGain.gain, hacker.gain, stossFilter.frequency, hohlOsz.frequency].forEach((par) => par.cancelScheduledValues(t0));
      stossGain.gain.setValueAtTime(0.0001, t0);
      hohlGain.gain.setValueAtTime(0.0001, t0);
      hacker.gain.setValueAtTime(1, t0);
      const hackBoden = lerp(1, 0.12, P.flatter);
      let letztesEnde = t0;
      for (const q of pulse) {
        const t = t0 + q.t, tiefer = lerp(1, 0.78, q.p) * P.ton;
        const boden = Math.max(0.0001, q.a * (0.07 + (1 - P.flatter) * 0.75));
        const hohl = q.a * P.koerper * 0.6, hohlBoden = hohl * 0.05 + 0.0001;
        letztesEnde = t + q.periode * 0.85;
        stossFilter.frequency.setValueAtTime(2200 * tiefer, t);
        stossFilter.frequency.exponentialRampToValueAtTime(700 * tiefer, t + q.periode * 0.6);
        stossGain.gain.setValueAtTime(boden, t);
        stossGain.gain.linearRampToValueAtTime(q.a, t + 0.004);
        stossGain.gain.exponentialRampToValueAtTime(boden, letztesEnde);
        hohlOsz.frequency.setValueAtTime(420 * tiefer, t);
        hohlOsz.frequency.exponentialRampToValueAtTime(260 * tiefer, t + q.periode * 0.5);
        hohlGain.gain.setValueAtTime(hohlBoden, t);
        hohlGain.gain.linearRampToValueAtTime(hohl, t + 0.006);
        hohlGain.gain.exponentialRampToValueAtTime(hohlBoden, letztesEnde);
        hacker.gain.setValueAtTime(hackBoden, t);
        hacker.gain.linearRampToValueAtTime(1, t + 0.004);
        hacker.gain.exponentialRampToValueAtTime(hackBoden, t + q.periode * 0.7);
      }
      const ende = Math.max(letztesEnde, t0 + dauer) + 0.07; // erst nach dem letzten Stoß ausblenden
      stossGain.gain.exponentialRampToValueAtTime(0.0001, ende);
      hohlGain.gain.exponentialRampToValueAtTime(0.0001, ende);
      return { dauer: ende - t0, pulse };
    }

    function frei() { // nach dem Abblasen: geplante Verläufe räumen, Hochdrehen darf wieder regeln
      const t = ctx.currentTime;
      [osz1.frequency, osz2.frequency, sinus.frequency, pfeifFilter.frequency, pfeifGain.gain, hacker.gain].forEach((par) => par.cancelScheduledValues(t));
      hacker.gain.setValueAtTime(1, t);
    }

    anwenden();
    return { ctx, nachfuehren, blowoff, frei, anwenden, pfeifHz: () => osz1.frequency.value };
  }

  let ctx = null, klang = null;

  function stilleUrl() { // 1 s Stille als WAV – hält auf älteren iPhones den Ton trotz Stummschalter an
    const rate = 8000, n = rate, puffer = new ArrayBuffer(44 + n), v = new DataView(puffer);
    const txt = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    txt(0, 'RIFF'); v.setUint32(4, 36 + n, true); txt(8, 'WAVEfmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true); txt(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([puffer], { type: 'audio/wav' }));
  }

  function tonStart() {
    if (ctx) { ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const istIOS = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
      else if (istIOS) {
        const a = new Audio(stilleUrl());
        a.loop = true; a.setAttribute('playsinline', ''); a.play().catch(() => {});
      }
    } catch (e) {}
    ctx = new AC();
    klang = baueKlang(ctx);
    ctx.resume();
  }

  // Nur zum Prüfen: rechnet ein Abblasen ohne Lautsprecher aus
  async function offline(staerke = 1, sekunden = 2.6) {
    const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const o = new OC(1, Math.ceil(44100 * sekunden), 44100);
    const kl = baueKlang(o);
    kl.nachfuehren(staerke);
    const plan = kl.blowoff(staerke, 0.5);
    const puffer = await o.startRendering();
    return { daten: puffer.getChannelData(0), rate: 44100, start: 0.5, dauer: plan.dauer, pulse: plan.pulse };
  }

  // ---------------------------------------------------------------------------
  // Ablauf: RUHE -> TRINKEN -> ABSETZEN -> RUHE
  // ---------------------------------------------------------------------------
  function absetzen(jetzt) {
    const staerke = z.druck;
    z.zustand = 'ABSETZEN';
    z.scharf = false;
    z.testBis = 0;
    z.letztePulse = 0;
    z.letzteStaerke = staerke;
    if (staerke < K.MIN_DRUCK) { z.absetzenBis = jetzt + 120; return; }

    let dauer = lerp(K.BLOWOFF_MIN_S, P.laenge, staerke), pulse = [];
    if (klang) ({ dauer, pulse } = klang.blowoff(staerke, ctx.currentTime + 0.015));
    z.letztePulse = pulse.length;
    z.absetzenBis = jetzt + dauer * 1000 + 60;
    z.blitz = 0.35 + 0.65 * staerke;
    if (staerke > z.best) {
      z.best = staerke;
      try { localStorage.setItem('turbo.v1', JSON.stringify({ best: z.best })); } catch (e) {}
    }
    if (navigator.vibrate) {
      const muster = [];
      let zuletzt = 0;
      if (!pulse.length) muster.push(Math.round(Math.min(400, dauer * 500)));
      for (const q of pulse) {
        const an = Math.min(30, q.periode * 400);
        if (muster.length) muster.push(Math.max(1, Math.round(q.t * 1000 - zuletzt)));
        muster.push(Math.round(an));
        zuletzt = q.t * 1000 + an;
      }
      try { navigator.vibrate(muster); } catch (e) {}
    }
  }

  function logik(jetzt, dt) {
    const w = z.testBis > jetzt ? P.einsatz + K.VOLL_ABSTAND : z.winkel;
    if (z.zustand === 'RUHE') {
      z.druck = Math.max(0, z.druck - dt / 0.4);
      if (!z.scharf && w < P.einsatz - K.SCHARF_ABSTAND) z.scharf = true;
      if (z.scharf && w > P.einsatz) {
        if (!z.anSeit) z.anSeit = jetzt;
        if (jetzt - z.anSeit >= K.AN_VERZOEGERUNG_MS) { z.zustand = 'TRINKEN'; z.spitzenWinkel = w; }
      } else {
        z.anSeit = 0;
      }
    } else if (z.zustand === 'TRINKEN') {
      z.spitzenWinkel = Math.max(z.spitzenWinkel, w);
      const kipp = klemme((w - P.einsatz) / K.VOLL_ABSTAND);
      z.druck = Math.min(1, z.druck + (dt / K.HOCHLAUF_S) * (0.35 + 0.65 * kipp));
      // früh auslösen: sobald das Handy merklich zurückkommt
      if (w < z.spitzenWinkel - P.abfall || w < P.einsatz - K.AUS_ABSTAND) absetzen(jetzt);
    } else {
      z.druck *= Math.exp(-dt / 0.12);
      if (jetzt >= z.absetzenBis) {
        z.zustand = 'RUHE'; z.anSeit = 0; z.druck = 0;
        if (klang) klang.frei();
      }
    }
    if (klang && z.zustand !== 'ABSETZEN') klang.nachfuehren(z.druck);
  }

  // ---------------------------------------------------------------------------
  // Anzeige (per Timer statt CSS-Animation, damit sie überall gleich läuft)
  // ---------------------------------------------------------------------------
  const el = {
    rad: $('rad'), schaufeln: $('schaufeln'), wisch: $('wisch'), bogen: $('bogen'), glut: $('glut'),
    druck: $('druck'), status: $('status'), winkel: $('winkel'), best: $('best'), blitz: $('blitz'),
  };
  const druckText = document.createTextNode('0,00');
  el.druck.replaceChild(druckText, el.druck.firstChild);
  const alt = {};

  function setze(schluessel, wert, fn) { if (alt[schluessel] !== wert) { alt[schluessel] = wert; fn(wert); } }

  function zeichne(dt) {
    const zielTempo = z.druck * K.RAD_MAX;
    const tau = zielTempo > z.radTempo ? 0.15 : 0.9; // hochdrehen folgt schnell, auslaufen träge
    z.radTempo += (zielTempo - z.radTempo) * (1 - Math.exp(-dt / tau));
    z.rad = (z.rad + z.radTempo * dt) % 360;
    z.blitz = Math.max(0, z.blitz - dt / 0.45);

    const tempoAnteil = klemme(z.radTempo / K.RAD_MAX);
    el.rad.setAttribute('transform', `rotate(${z.rad.toFixed(1)})`);
    setze('wisch', klemme(tempoAnteil * 1.4).toFixed(2), (v) => { el.wisch.setAttribute('opacity', v); });
    setze('schaufeln', (1 - 0.7 * tempoAnteil).toFixed(2), (v) => { el.schaufeln.setAttribute('opacity', v); });
    setze('bogen', (z.druck * BOGEN).toFixed(1), (v) => { el.bogen.setAttribute('stroke-dasharray', `${v} ${UMFANG}`); });
    setze('bogenSichtbar', z.druck > 0.004, (v) => { el.bogen.style.visibility = v ? 'visible' : 'hidden'; });
    setze('glut', (z.druck * 0.16).toFixed(3), (v) => { el.glut.setAttribute('opacity', v); });
    // Blau -> Violett -> Rot -> Orange (über 360° hinweg, damit es nie grün wird)
    setze('akzent', Math.round(lerp(196, 378, Math.pow(z.druck, 0.85))) % 360, (h) => {
      document.documentElement.style.setProperty('--akzent', `hsl(${h} 96% 60%)`);
    });
    setze('druck', bar(z.druck), (v) => { druckText.nodeValue = v; });
    setze('winkel', Math.round(z.winkel) + '°', (v) => { el.winkel.textContent = v; });
    setze('best', bar(z.best) + ' bar', (v) => { el.best.textContent = v; });
    setze('blitz', z.blitz.toFixed(2), (v) => { el.blitz.style.opacity = v; });

    let status;
    if (!z.laeuft) status = 'Bereit';
    else if (!z.sim && !ref) status = 'Ruhelage wird gemessen …';
    else if (z.zustand === 'ABSETZEN') status = z.letzteStaerke < K.MIN_DRUCK ? '…' : (z.letztePulse ? 'PSCH-TU-TU-TU!' : 'PSCHHH!');
    else if (z.zustand === 'TRINKEN') status = z.druck >= 0.995 ? 'Volllast!' : 'Turbo lädt …';
    else status = `Über ${Math.round(P.einsatz)}° kippen`;
    setze('status', status, (v) => { el.status.textContent = v; });
  }

  let letzterTick = performance.now();
  setInterval(() => {
    const jetzt = performance.now();
    const dt = Math.min(0.1, (jetzt - letzterTick) / 1000);
    letzterTick = jetzt;
    if (z.laeuft) logik(jetzt, dt);
    zeichne(dt);
  }, 16);

  // ---------------------------------------------------------------------------
  // Klang-Labor: am Handy nachregeln, Werte kopieren
  // ---------------------------------------------------------------------------
  const labor = { eingaben: {}, anzeigen: {} };

  function zeigeWerte() {
    for (const [k, , , , schritt, einheit] of REGLER) {
      labor.eingaben[k].value = P[k];
      labor.anzeigen[k].textContent = (schritt < 1 ? P[k].toFixed(2) : String(Math.round(P[k]))).replace('.', ',') + einheit;
    }
    $('werte').value = JSON.stringify(P);
  }
  function speichereWerte() {
    try { localStorage.setItem('turbo.klang.v1', JSON.stringify(P)); } catch (e) {}
    if (klang) klang.anwenden();
    zeigeWerte();
  }
  (function baueLabor() {
    const feld = $('regler');
    for (const [k, name, min, max, schritt] of REGLER) {
      const l = document.createElement('label');
      const s = document.createElement('span'); s.textContent = name;
      const b = document.createElement('b');
      const i = document.createElement('input');
      i.type = 'range'; i.min = min; i.max = max; i.step = schritt;
      i.addEventListener('input', () => { P[k] = Number(i.value); speichereWerte(); });
      l.append(s, b, i); feld.appendChild(l);
      labor.eingaben[k] = i; labor.anzeigen[k] = b;
    }
    const reihe = $('vorgaben');
    for (const name of Object.keys(VORGABEN)) {
      const knopf = document.createElement('button');
      knopf.type = 'button'; knopf.textContent = name;
      knopf.addEventListener('click', () => {
        const { einsatz, abfall } = P; // Auslösung bleibt, nur der Klang wechselt
        Object.assign(P, STANDARD, VORGABEN[name], { einsatz, abfall });
        speichereWerte();
      });
      reihe.appendChild(knopf);
    }
    zeigeWerte();
  })();

  function laborAuf(offen) { $('labor').classList.toggle('offen', offen); }
  $('laborZu').addEventListener('click', () => laborAuf(false));
  $('zurueck').addEventListener('click', () => { Object.assign(P, STANDARD); speichereWerte(); });
  $('kopieren').addEventListener('click', async () => {
    const feld = $('werte'), knopf = $('kopieren');
    try { await navigator.clipboard.writeText(feld.value); knopf.textContent = 'Kopiert'; }
    catch (e) { feld.focus(); feld.select(); knopf.textContent = 'Markiert'; }
    setTimeout(() => { knopf.textContent = 'Werte kopieren'; }, 1500);
  });
  $('testBlowoff').addEventListener('click', () => {
    if (!z.laeuft || z.zustand === 'ABSETZEN') return;
    z.druck = 1; z.zustand = 'TRINKEN'; z.spitzenWinkel = 999; z.testBis = 0; // nächster Takt löst aus
  });
  $('testHoch').addEventListener('click', () => {
    if (!z.laeuft || z.zustand === 'ABSETZEN') return;
    z.scharf = true; z.testBis = performance.now() + 4000; // 4 s laden, danach bläst er ab
  });
  let druckTimer = 0;
  const marke = $('marke');
  marke.addEventListener('pointerdown', () => { druckTimer = setTimeout(() => laborAuf(!$('labor').classList.contains('offen')), 700); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((n) => marke.addEventListener(n, () => clearTimeout(druckTimer)));

  // ---------------------------------------------------------------------------
  // Start (braucht einen Tipp: Sensorfreigabe und Ton gibt es nur nach Nutzergeste)
  // ---------------------------------------------------------------------------
  let wachSperre = null;
  async function wachHalten() {
    try { if (navigator.wakeLock && !wachSperre) { wachSperre = await navigator.wakeLock.request('screen'); wachSperre.addEventListener('release', () => { wachSperre = null; }); } } catch (e) {}
  }

  async function start() {
    const knopf = $('los');
    knopf.disabled = true;
    $('hinweis').textContent = '';
    tonStart(); // sofort im Tipp, vor jedem await

    let sensor = !SIM_ERZWUNGEN && typeof DeviceMotionEvent !== 'undefined';
    if (sensor && typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const antwort = await DeviceMotionEvent.requestPermission();
        if (antwort !== 'granted') {
          $('hinweis').textContent = 'Ohne Sensor-Freigabe geht es nicht. Seite neu laden und „Erlauben“ wählen.';
          knopf.disabled = false;
          return;
        }
      } catch (e) { sensor = false; }
    }
    if (sensor) window.addEventListener('devicemotion', aufBewegung);

    wachHalten();
    $('start').style.display = 'none';
    z.laeuft = true;
    if (PARAMETER.has('labor')) laborAuf(true);

    if (!sensor) {
      simAn(SIM_ERZWUNGEN ? 'Kippwinkel (Test)' : 'Kein Bewegungssensor – Regler zum Testen');
    } else {
      setTimeout(() => {
        if (!proben) simAn(window.isSecureContext ? 'Kein Bewegungssensor gefunden – Regler zum Testen' : 'Sensoren brauchen HTTPS – Regler zum Testen');
      }, 1500);
    }
  }

  $('los').addEventListener('click', start);
  $('ausrichten').addEventListener('click', neuAusrichten);
  $('simRegler').addEventListener('input', (e) => { if (z.sim) z.winkel = Number(e.target.value); });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      z.zustand = 'RUHE'; z.druck = 0; z.anSeit = 0; z.testBis = 0;
      if (klang) { klang.frei(); klang.nachfuehren(0); }
    } else if (z.laeuft) {
      if (ctx) ctx.resume();
      wachHalten();
    }
  });

  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Für Tests am PC
